<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 학습 도우미</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#e3f2fd,#fce4ec);
min-height:100vh;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

.card{
background:#f8f9fa;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:8px;
}

textarea{
min-height:150px;
resize:vertical;
}

button{
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.primary{
background:#42a5f5;
color:white;
}

.success{
background:#4caf50;
color:white;
}

.danger{
background:#ef5350;
color:white;
}

.secondary{
background:#9e9e9e;
color:white;
}

.answer{
background:#f1f8ff;
padding:15px;
border-radius:12px;
min-height:150px;
white-space:pre-wrap;
}

.hidden{
display:none;
}

audio{
width:100%;
margin-top:10px;
}

.history-item{
padding:10px;
margin-top:10px;
background:white;
border-radius:10px;
border-left:4px solid #42a5f5;
}

.user-info{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

<h1>AI 학습 도우미</h1>

<div class="subtitle">
Firebase + Authentication + AI + TTS
</div>

<!-- 로그인 -->

<div id="loginArea">

<div class="card">

<h3>회원가입</h3>

<input type="email" id="signupEmail" placeholder="이메일">

<input type="password" id="signupPassword" placeholder="비밀번호">

<button class="success" id="signupBtn">
회원가입
</button>

</div>

<div class="card">

<h3>로그인</h3>

<input type="email" id="loginEmail" placeholder="이메일">

<input type="password" id="loginPassword" placeholder="비밀번호">

<button class="primary" id="loginBtn">
로그인
</button>

</div>

</div>

<!-- 메인 -->

<div id="mainArea" class="hidden">

<div class="user-info">

<div>
로그인 :
<span id="userEmail"></span>
</div>

<button id="logoutBtn" class="danger">
로그아웃
</button>

</div>

<div class="card">

<h3>AI 질문</h3>

<textarea
id="questionInput"
placeholder="질문을 입력하세요">
</textarea>

<button id="askBtn" class="primary">
AI 답변 생성
</button>

</div>

<div class="card">

<h3>AI 답변</h3>

<div id="answerBox" class="answer">
아직 답변 없음
</div>

</div>

<div class="card">

<h3>TTS 음성 변환</h3>

<select id="voiceSelect">

<option value="alloy">alloy</option>

<option value="echo">echo</option>

<option value="fable">fable</option>

<option value="nova">nova</option>

<option value="onyx">onyx</option>

<option value="shimmer">shimmer</option>

</select>

<button id="ttsBtn" class="success">
음성 생성
</button>

<audio id="audioPlayer" controls></audio>

</div>

<div class="card">

<h3>질문 기록</h3>

<div id="historyBox"></div>

</div>

</div>

</div>

  <!-- Firebase SDK -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4OeJNLOSIM_XZzUn4ortKM8eAYErh-Yc",
  authDomain: "ghddbtjdrowlsek.firebaseapp.com",
  databaseURL: "https://ghddbtjdrowlsek-default-rtdb.firebaseio.com",
  projectId: "ghddbtjdrowlsek",
  storageBucket: "ghddbtjdrowlsek.firebasestorage.app",
  messagingSenderId: "896860078725",
  appId: "1:896860078725:web:ca6d89954789cc200a9fec",
  measurementId: "G-WFPBGWQ2R4"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const CHAT_API =
"https://script.google.com/macros/s/AKfycbwQK8Dxfv_hsphNAA7ytpnsFjGYmgXW8iUgi5gpCDCYhI3kNWZcz9TMLQ65iX7WO5R4/exec";

const TTS_API =
"https://script.google.com/macros/s/AKfycbxDNMIktE288seW2Mr5YgksYFeAP3SNl8YyQZFa1DuvD0N_8pjRLDmxkZBYyQ4WGPmt/exec";

const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const loginArea = document.getElementById("loginArea");
const mainArea = document.getElementById("mainArea");

const userEmail = document.getElementById("userEmail");

const questionInput =
document.getElementById("questionInput");

const askBtn =
document.getElementById("askBtn");

const answerBox =
document.getElementById("answerBox");

const ttsBtn =
document.getElementById("ttsBtn");

const voiceSelect =
document.getElementById("voiceSelect");

const audioPlayer =
document.getElementById("audioPlayer");

const historyBox =
document.getElementById("historyBox");

  signupBtn.addEventListener("click", async () => {

  const email =
    document.getElementById("signupEmail").value;

  const password =
    document.getElementById("signupPassword").value;

  try {

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("회원가입 완료");

  } catch(error) {

    alert(error.message);

  }

});

loginBtn.addEventListener("click", async () => {

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch(error) {

    alert(error.message);

  }

});

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

});

onAuthStateChanged(auth,(user)=>{

  if(user){

    loginArea.classList.add("hidden");
    mainArea.classList.remove("hidden");

    userEmail.textContent = user.email;

    loadHistory(user.uid);

  }else{

    loginArea.classList.remove("hidden");
    mainArea.classList.add("hidden");

  }

});

askBtn.addEventListener("click", async ()=>{

  const question = questionInput.value.trim();

  if(!question){
    alert("질문 입력");
    return;
  }

  answerBox.textContent =
    "답변 생성 중...";

  try{

    const response = await fetch(CHAT_API,{
      method:"POST",
      body:JSON.stringify({
        question:question
      })
    });

    const data =
      await response.json();

    const answer =
      data.answer ||
      "답변 없음";

    answerBox.textContent =
      answer;

    const user =
      auth.currentUser;

    await push(
      ref(db,"history/"+user.uid),
      {
        question:question,
        answer:answer,
        date:new Date().toLocaleString()
      }
    );

  }catch(error){

    answerBox.textContent =
      error.message;

  }

});

ttsBtn.addEventListener("click", async ()=>{

  const text =
    answerBox.textContent;

  if(
    !text ||
    text==="아직 답변 없음"
  ){
    alert("먼저 답변 생성");
    return;
  }

  try{

    const response =
      await fetch(TTS_API,{
        method:"POST",
        body:JSON.stringify({
          type:"tts",
          text:text,
          model:"tts-1",
          voice:voiceSelect.value,
          speed:1
        })
      });

    const data =
      await response.json();

    const binary =
      atob(data.audioBase64);

    const bytes =
      new Uint8Array(binary.length);

    for(
      let i=0;
      i<binary.length;
      i++
    ){
      bytes[i]=
      binary.charCodeAt(i);
    }

    const blob =
      new Blob(
        [bytes],
        {type:"audio/mpeg"}
      );

    audioPlayer.src =
      URL.createObjectURL(blob);

  }catch(error){

    alert(error.message);

  }

});

function loadHistory(uid){

  const historyRef =
    ref(
      db,
      "history/"+uid
    );

  onValue(historyRef,(snapshot)=>{

    historyBox.innerHTML="";

    snapshot.forEach((item)=>{

      const data =
        item.val();

      historyBox.innerHTML += `
      <div class="history-item">
      <b>질문</b><br>
      ${data.question}
      <hr>
      <b>답변</b><br>
      ${data.answer}
      </div>
      `;

    });

  });

}
</script>

</body>
</html>
